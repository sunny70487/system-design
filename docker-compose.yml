services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: system-design:latest
    container_name: system-design
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
